spring:
  application:
    name: trade-service
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 192.168.121.162:8848
      config:
        file-extension: yaml
        shared-configs:
          - dataId: shared-jdbc.yaml
          - dataId: shared-log.yaml
          - dataId: shared-swagger.yaml

seata:
  enabled: true
  registry:
    type: nacos
    nacos:
      server-addr: 192.168.121.162:8848
      namespace: ""
      group: DEFAULT_GROUP
      application: seata-server
      username: nacos
      password: nacos
  tx-service-group: hmall
  service:
    vgroup-mapping:
      hmall: default
  client:
    tm:
      default-global-transaction-timeout: 30000